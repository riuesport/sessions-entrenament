<!DOCTYPE html>
<html lang="ca"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RIU · Programa de sessions amb exportació TV · Desembre–Maig</title>
<style>
:root{--navy:#072D53;--blue:#048fc1;--bright:#08a6d3;--ink:#1e2b39;--muted:#6c7988;--light:#f4f7f9;--stroke:#e3eaf0;--pale:#e9f6fa;--green:#138864;--mint:#e7f5ee;--shadow:0 8px 30px rgba(7,45,83,.06)}
*{box-sizing:border-box}body{margin:0;background:#f5f7f9;color:var(--ink);font:14px/1.5 'Segoe UI',Inter,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #7cd2ee;outline-offset:2px}
header{background:var(--navy);color:white;padding:0 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:78px}.brand{display:flex;gap:18px;align-items:center}.wordmark{font-size:34px;font-weight:900;letter-spacing:-.065em}.brandlabel{font-size:12px;letter-spacing:.15em;text-transform:uppercase;opacity:.75}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.top-actions button{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.3);padding:9px 13px;color:white;border-radius:8px}.top-actions button:hover{background:rgba(255,255,255,.18)}
nav{background:white;border-bottom:1px solid var(--stroke);padding:0 max(24px,calc((100vw - 1370px)/2));display:flex;gap:3px;overflow:auto}.navbtn{border:0;background:transparent;border-bottom:3px solid transparent;color:#5b6b7d;padding:17px 19px;font-weight:700;white-space:nowrap}.navbtn.active{border-color:var(--bright);color:var(--navy)}main{max-width:1420px;margin:0 auto;padding:30px 28px 70px}.page-title{font-size:30px;font-weight:800;color:var(--navy);letter-spacing:-.04em;line-height:1.17;margin:0 0 8px}.lead{color:var(--muted);margin:0 0 22px;font-size:14px}.panel{background:white;border:1px solid var(--stroke);border-radius:12px;box-shadow:var(--shadow);padding:20px;margin-bottom:18px}.panel h2{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);margin:0 0 18px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:24px 0}.stat{padding:20px;border:1px solid var(--stroke);border-radius:11px;background:white}.stat .num{font-weight:800;font-size:31px;color:var(--navy);line-height:1}.stat .label{color:var(--muted);margin-top:7px}.btn{border:1px solid var(--stroke);background:white;color:var(--navy);padding:9px 13px;border-radius:8px;font-weight:650}.btn.primary{background:var(--navy);color:white;border-color:var(--navy)}.btn.blue{background:var(--bright);color:white;border-color:var(--bright)}.btn.small{font-size:12px;padding:6px 10px}.btn:hover{filter:brightness(.97)}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.grow{flex:1}.text-muted{color:var(--muted)}.pill{border:1px solid #b6dae7;color:#116b88;background:var(--pale);font-size:12px;padding:4px 9px;border-radius:999px;display:inline-block}.pill.green{border-color:#bae4cf;background:var(--mint);color:#147451}.pill.grey{border-color:var(--stroke);background:#f5f6f7;color:#626c77}.pill.warn{background:#fff4e5;color:#a15c10;border-color:#f2d29a}
.tablewrap{overflow:auto;border-radius:11px;border:1px solid var(--stroke)}table{width:100%;border-collapse:collapse;min-width:830px;background:white}thead th{position:sticky;top:0;background:#eef3f6;color:var(--navy);font-size:11px;letter-spacing:.05em;text-transform:uppercase;text-align:left}th,td{padding:11px 13px;border-bottom:1px solid var(--stroke);vertical-align:top}tbody tr:hover{background:#fafcfd}td strong{color:var(--navy)}.mono{font-variant-numeric:tabular-nums}.macro-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.macro-head h2{margin:0;font-size:18px;letter-spacing:0;text-transform:none}.month-card{background:white;border:1px solid var(--stroke);border-radius:12px;overflow:hidden;margin-bottom:18px}.month-top{padding:17px 18px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;gap:12px}.month-top h3{font-size:18px;margin:0}.month-top p{opacity:.75;font-size:12px;margin:3px 0 0}.month-top .btn{border-color:white;color:white;background:transparent}.month-top .btn:hover{background:rgba(255,255,255,.1)}
.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}.control{display:flex;align-items:center;gap:9px}.control label{font-weight:700;color:var(--navy)}select,input,textarea{background:white;border:1px solid #ccd9e3;border-radius:8px;padding:10px 11px;min-width:0;color:var(--ink)}select{max-width:100%}.day-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.day-tabs button{border:1px solid var(--stroke);background:white;color:#6b7885;border-radius:7px;padding:10px 13px;font-weight:700}.day-tabs button.active{background:var(--bright);color:white;border-color:var(--bright)}
.session-top{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 18px}.field{border:1px solid var(--stroke);border-radius:9px;background:white;overflow:hidden}.field .fieldlab{font-size:11px;text-transform:uppercase;letter-spacing:.045em;color:var(--muted);padding:10px 12px 4px;font-weight:800}.field .fieldval{padding:0 12px 12px;font-weight:700;color:var(--navy);min-height:40px}.field .fieldval select,.field .fieldval input{width:100%}.session-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.session-grid .panel{margin-bottom:0}.section-caption{display:flex;justify-content:space-between;gap:10px;align-items:center}.section-caption .pill{white-space:nowrap}.pick-row{display:flex;align-items:center;gap:12px;margin:7px 0;padding:9px;border:1px solid var(--stroke);border-radius:8px;min-height:57px}.pick-index{font-weight:800;color:var(--blue);width:23px;flex:none;text-align:center}.pick-text{flex:1;min-width:0}.pick-name{font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pick-sub{font-size:11px;color:var(--muted)}.pick-buttons{display:flex;gap:5px}.pill-slot{background:var(--mint);color:var(--green);padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700}.input-row{display:flex;flex-direction:column;gap:5px;margin:12px 0}.input-row label{color:var(--muted);font-size:11px;letter-spacing:.05em;font-weight:800;text-transform:uppercase}.input-row input,.input-row textarea{width:100%;background:#fafcfd}.week-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.week-grid input{width:100%;padding:9px 7px}.week-grid label{display:block;font-weight:800;color:var(--muted);font-size:11px;margin-bottom:5px}.wide{grid-column:1/-1}.empty{padding:30px;text-align:center;color:var(--muted);background:#fafbfc;border:1px dashed #c5d1dc;border-radius:8px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:15px}.filters input{min-width:240px;flex:2}.filters select{flex:1;min-width:170px}.catalog-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.item-card{padding:13px;background:white;border:1px solid var(--stroke);border-radius:9px;display:flex;align-items:center;gap:12px;text-align:left;min-width:0}.item-card:hover{border-color:#66b8d3;background:#f9fdff}.thumb{background:#e8f0f5;color:#7895a6;width:52px;height:52px;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;font-size:20px}.thumb img{width:100%;height:100%;object-fit:cover}.item-card .body{flex:1;min-width:0}.item-card .name{font-weight:700;color:var(--navy)}.item-card .meta{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.step{display:flex;gap:15px;margin:10px 0;padding:12px 0;border-bottom:1px solid var(--stroke)}.step:last-child{border:0}.stepmark{height:34px;width:34px;border-radius:9px;background:var(--pale);color:var(--blue);display:grid;place-items:center;font-weight:900;flex:none}.step strong{color:var(--navy)}.sep{height:1px;background:var(--stroke);margin:16px 0}
.overlay{position:fixed;inset:0;background:rgba(4,24,47,.64);z-index:80;display:flex;align-items:center;justify-content:center;padding:22px}.modal{background:white;border-radius:14px;width:min(760px,100%);max-height:88vh;overflow:auto;box-shadow:0 20px 80px rgba(0,0,0,.22)}.modalhead{position:sticky;top:0;background:white;z-index:2;border-bottom:1px solid var(--stroke);padding:17px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px}.modalhead h3{margin:0;color:var(--navy);font-size:19px}.modalbody{padding:20px}.close{border:0;background:#f0f3f5;border-radius:7px;width:34px;height:34px;color:var(--navy);font-size:20px}.chooselist{max-height:420px;overflow:auto;margin-top:15px}.chooserow{display:flex;width:100%;align-items:center;text-align:left;background:white;border:0;border-bottom:1px solid var(--stroke);padding:11px;gap:12px}.chooserow:hover{background:var(--pale)}.chooserow span:first-child{flex:1}.mini{font-size:11px;color:var(--muted)}.media-preview{background:#f0f5f8;aspect-ratio:16/8;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#738ea0;overflow:hidden}.media-preview img{height:100%;width:100%;object-fit:contain}.formcols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formcols .full{grid-column:1/-1}.notice{background:var(--pale);color:#1a5f7a;padding:12px;border-radius:8px;margin-top:12px;font-size:12px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;padding:11px 18px;border-radius:9px;box-shadow:0 12px 36px #0003;z-index:120;display:none}.backuplabel{font-size:12px;color:var(--muted)}
@media(max-width:900px){header{padding:12px 16px;flex-direction:column;align-items:flex-start}nav{padding:0 12px}.navbtn{padding:12px 14px}main{padding:18px 13px}.session-grid{grid-template-columns:1fr}.session-top{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.catalog-list{grid-template-columns:1fr}}@media(max-width:540px){.formcols{grid-template-columns:1fr}.session-top{grid-template-columns:1fr}.week-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.controls select{width:100%}.page-title{font-size:25px}.top-actions button{font-size:12px}}
@media print{header,nav,.top-actions,.controls,.day-tabs,.pick-buttons,.actionbar,.btn,.filters{display:none!important}body{background:white}main{padding:0}.panel,.field{box-shadow:none;break-inside:avoid}#app{font-size:11px}.session-grid{display:grid;grid-template-columns:1fr 1fr}.pick-row{min-height:35px;padding:5px}}

/* V2 · selection clarity and flexible classification */
.pick-text-btn{background:transparent;border:0;text-align:left;padding:0;cursor:pointer}.pick-text-btn:hover .pick-name{text-decoration:underline}
.main-select-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:9px 10px;border-radius:8px;border:1px solid #8bc7d9;background:#f0fafe;color:var(--navy);text-align:left;font-weight:800;min-height:43px}
.main-select-btn:hover{background:#dff4fb;border-color:var(--bright)}
.main-select-btn small{font-size:11px;font-weight:750;color:#126a89;white-space:nowrap}
.method-note{padding:11px 14px;margin:-2px 0 17px;background:#f1f8f4;border:1px solid #cce7d6;border-radius:9px;color:#32644d;font-size:12px}
.filter-help{font-size:12px;color:var(--muted);margin:-5px 0 12px}
.tag-group{display:flex;flex-wrap:wrap;gap:7px;margin:7px 0 12px}
.tag-check{display:inline-flex;gap:7px;align-items:center;padding:7px 10px;background:#f6f8fa;border:1px solid var(--stroke);border-radius:8px;font-size:12px;font-weight:600;color:var(--navy);cursor:pointer}
.tag-check input{width:auto;min-width:0;accent-color:var(--blue)}
.tag-label{font-size:11px;color:var(--muted);letter-spacing:.05em;font-weight:800;text-transform:uppercase;margin-top:14px}
.rel-pill{display:inline-flex;align-items:center;border:1px solid #bfe2d3;background:#ebf7f0;color:#24644f;border-radius:99px;padding:2px 7px;font-size:10px;font-weight:650}
.picker-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.picker-toolbar label{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--navy);font-weight:650}
.picker-toolbar input{width:auto;accent-color:var(--blue)}
@media(max-width:540px){.main-select-btn{flex-wrap:wrap}.picker-toolbar{align-items:flex-start;flex-direction:column}}

/* RIU v4: fotografies de la biblioteca vinculades a les sessions */
.pick-photo{width:68px;height:68px;flex:0 0 68px;background:#edf4f7;border:1px solid #d6e5ed;border-radius:9px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;color:#6c8290;padding:0;cursor:pointer}
.pick-photo img{width:100%;height:100%;object-fit:contain;background:white}
.pick-photo:hover{border-color:var(--bright);box-shadow:0 0 0 2px #cbeef7}
.pick-photo .photo-empty{font-size:11px;line-height:1.15;text-align:center;padding:5px}
.pick-photo .photo-empty b{display:block;font-size:21px;line-height:1;margin-bottom:4px}
.pick-row{min-height:84px}.pick-text{min-width:0}.pick-name{white-space:normal;line-height:1.3}
.photo-picker-thumb{width:49px;height:49px;flex:0 0 49px;border-radius:8px;background:#eff4f7;overflow:hidden;display:grid;place-items:center;color:#91a3af;font-size:15px}
.photo-picker-thumb img{width:100%;height:100%;object-fit:contain}
.photo-full{text-align:center;background:#f0f5f8;border-radius:10px;min-height:230px;display:flex;justify-content:center;align-items:center}
.photo-full img{max-height:65vh;width:100%;object-fit:contain}
.photo-viewer .modal{width:min(1000px,100%)}
.session-view-header{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.session-summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.session-section{margin:0 0 23px}
.session-section h2{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);padding-bottom:10px;border-bottom:2px solid #e1ebf1;margin:0 0 12px}
.session-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.session-tile{border:1px solid var(--stroke);border-radius:10px;overflow:hidden;background:white;min-width:0}
.session-tile .tile-photo{background:#edf4f7;height:160px;display:flex;align-items:center;justify-content:center;width:100%;border:0;padding:0;color:#8795a4;cursor:pointer}
.session-tile .tile-photo img{width:100%;height:100%;object-fit:contain;background:white}
.session-tile .tile-body{padding:12px}
.session-tile .tile-name{font-weight:800;color:var(--navy);line-height:1.3;margin-bottom:4px}
.session-tile .tile-meta{font-size:11px;color:var(--muted)}
.session-tile .tile-label{font-size:10px;font-weight:800;text-transform:uppercase;color:#1781a4;letter-spacing:.04em;margin-bottom:5px}
.session-tile.empty-tile .tile-photo{cursor:default}
.session-note{background:var(--pale);border:1px solid #cfe8ef;border-radius:8px;padding:10px 13px;color:#28566b;font-size:12px}
@media(max-width:900px){.session-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:550px){.session-tiles{grid-template-columns:1fr}.pick-photo{width:54px;height:54px;flex-basis:54px}.pick-row{gap:7px}.pick-buttons{flex-direction:column}}
@media print{.pick-photo{width:55px;height:55px;flex-basis:55px}.pick-row{min-height:63px}.session-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.session-tile{break-inside:avoid}.session-tile .tile-photo{height:115px}.session-view-header .btn{display:none!important}.session-note{break-inside:avoid}body{print-color-adjust:exact;-webkit-print-color-adjust:exact}}


/* V5 · Sessió flexible: afegir, treure i canviar el tipus de tasca */
.session-config{background:#fff;border:1px solid var(--stroke);border-radius:12px;padding:14px 16px;margin:15px 0 19px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.session-config .cfg-head{font-weight:800;color:var(--navy);margin-right:4px}
.session-config label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink);cursor:pointer}
.session-config input[type=checkbox]{accent-color:var(--navy)}
.session-config select{min-width:190px;background:#fff;border:1px solid #cddae4;border-radius:7px;padding:8px}
.config-help{font-size:12px;color:#526678;flex-basis:100%;margin:0}
.entry-with-controls{display:flex;gap:6px;align-items:stretch;margin-bottom:7px;min-width:0}
.entry-with-controls>.pick-row{flex:1;min-width:0;margin-bottom:0}
.entry-with-controls .entry-remove{flex:0 0 28px;border:1px solid #e5c9c9;border-radius:8px;background:#fff4f4;color:#904444;font-size:18px;cursor:pointer}
.entry-with-controls .entry-remove:hover{background:#ffe5e5}
.entry-with-controls .kind-select{max-width:128px;min-width:98px;align-self:center;border:1px solid #cddae4;border-radius:8px;background:#f9fbfd;padding:8px 4px;font-size:11px;color:var(--navy)}
.add-slot{width:100%;margin-top:8px;border:1px dashed #a5c5d7;background:#f5fbfd;color:#205d7b;border-radius:8px;font-weight:750;font-size:12px;padding:9px;cursor:pointer}
.add-slot:hover{background:#e7f6fb}
.add-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.add-group .add-slot{width:auto;flex:1;min-width:135px}
.pill.small-soft{font-size:11px;padding:3px 8px}
.block-hidden{color:#6f7c88;font-size:12px;padding:12px;background:#f4f7f9;border-radius:8px}
.section-settings{margin-top:8px}
.section-settings input{width:100%;padding:7px 9px;border:1px solid #d8e2e9;border-radius:6px;font-size:12px}
.picker-kind-note{font-size:11px;color:#526678;margin-top:4px}
@media(max-width:850px){.entry-with-controls{align-items:start;flex-wrap:wrap}.entry-with-controls>.pick-row{flex-basis:100%}.entry-with-controls .entry-remove{height:32px}.entry-with-controls .kind-select{max-width:none;flex:1}}
@media print{.session-config,.add-group,.add-slot,.entry-remove,.kind-select,.section-settings{display:none!important}}

/* RIU · Exportador de diapositives per a pantalla/Canva/PowerPoint */
.tv-modal .modal{width:min(1220px,98vw);max-height:95vh}
.tv-body{display:grid;grid-template-columns:minmax(290px,410px) minmax(330px,1fr);gap:20px;align-items:start}
.tv-controls{display:flex;flex-direction:column;gap:14px}
.tv-control-label{font-weight:800;color:var(--navy);font-size:12px;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:5px}
.tv-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tv-options>label{min-width:0}
.tv-options select{width:100%}
.tv-checks{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--navy)}
.tv-checks label{display:flex;align-items:center;gap:6px;cursor:pointer}.tv-checks input{min-width:0}
.tv-doses{border:1px solid var(--stroke);border-radius:9px;max-height:390px;overflow:auto;padding:9px;background:#fbfcfd}
.tv-dose-row{display:grid;grid-template-columns:1fr minmax(90px,115px);gap:8px;align-items:center;margin:5px 0}
.tv-dose-row label{font-size:12px;line-height:1.3;overflow-wrap:anywhere;color:var(--ink)}
.tv-dose-row input{width:100%;min-width:0;padding:7px;font-size:12px}
.tv-dose-caption{font-size:11px;font-weight:800;color:var(--navy);padding:9px 0 4px;border-bottom:1px solid #dce5eb;margin:5px 0}
.tv-preview-col{background:#edf1f5;border-radius:12px;padding:16px;display:flex;align-items:center;flex-direction:column;min-height:440px;gap:10px}
#tvPreview{display:block;width:auto;max-width:100%;max-height:72vh;object-fit:contain;box-shadow:0 18px 40px #122d4433;background:#161616}
.tv-export-buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.tv-help{font-size:11px;color:var(--muted);line-height:1.5}
.tv-actions-in-meso{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#tvFullscreenLayer{position:fixed;inset:0;z-index:99999;background:#080808;display:flex;justify-content:center;align-items:center;padding:0}
#tvFullscreenLayer canvas{max-width:100vw;max-height:100vh;width:auto;height:auto;object-fit:contain}
#tvFullscreenLayer .tv-exit{position:fixed;right:15px;top:14px;background:#0009;color:#fff;border:1px solid #fff7;padding:8px 14px;border-radius:8px;z-index:2}
@media(max-width:900px){.tv-body{grid-template-columns:1fr}.tv-preview-col{order:-1;min-height:240px}#tvPreview{max-height:52vh}}

/* RIU · Eliminació controlada d'exercicis i tasques de la biblioteca */
.btn.danger{border:1px solid #d48a8a;background:#fff4f4;color:#a12828}
.btn.danger:hover{background:#ffe5e5;border-color:#b65e5e}
.btn.danger.solid{background:#b72b39;border-color:#b72b39;color:white}
.btn.danger.solid:hover{background:#97212d}
.danger-zone{margin-top:19px;padding:15px 0 0;border-top:1px solid #ecd0d2;display:flex;gap:15px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.danger-zone .text{flex:1;min-width:210px;font-size:12px;color:#8a4750}
.delete-summary{border:1px solid #f0d3d6;background:#fff7f7;border-radius:10px;padding:13px 15px;margin:14px 0}
.delete-summary strong{color:#8e2430}
.delete-options{display:flex;gap:10px;align-items:flex-start;padding:12px 13px;border:1px solid var(--stroke);border-radius:9px;margin:13px 0;cursor:pointer}

// V2. La classificació principal de la biblioteca NO és igual als blocs on es pot utilitzar.
// Els camps uses i relatedPatterns es poden modificar individualment a cada fitxa.
function inferredUses(x){
 const b=x.block||'', n=norm(x.name+' '+x.sub);
 if(b==='Mobilitat')return ['Mobilitat','Activació'];
 if(b==='Activació')return ['Activació'];
 if(b==='HMB')return ['Activació'];
 if(b==='Condicionament'||b==='Cardio')return ['Cardio'];
 if(b==='Accessoris'){
  const out=['Força'];
  if(/escap|rotad|rotac|maneguet|cuff|control|estabil|activac|deltoide posterior|face pull|pallof/.test(n))out.unshift('Activació');
  return out;
 }
 if(b==='Potència / integració'){
  const out=['Força'];
  if(/thruster|swing|slam ball|wall ball|push press/.test(n))out.push('Cardio');
  return out;
 }
 if(b==='Força'){
  const out=['Força'];
  if(/glute bridge|pont de glutis|puente de gluteos|air squat|squat amb pes corporal|dead bug|bird dog|bisagra de maluc agenollat|flexions inclinades|dominada escapular/.test(n))out.unshift('Activació');
  if(/shuttle run|step.?up|farmer carry|suitcase carry|mountain climber|slam ball/.test(n))out.push('Cardio');
  return out;
 }
 return ['Força'];
}
function inferredRelatedPatterns(x){
 const p=x.pattern||'', b=x.block||'', n=norm(x.name+' '+x.sub+' '+p);
 const found=new Set();
 if(PATTERNS.includes(p))found.add(p);
 if(b==='Força'&&PATTERNS.includes(p))return [...found];
 // Associacions de suport: un moviment de mobilitat o activació pot preparar diversos patrons.
 if(/dominad|pull.?up|pulldown|jalo|jalon|scapular pull|depressio escapular/.test(n))found.add('Tracció vertical');
 if(/remo|\brow\b|face pull|pull apart|retraccio|retraccion|escapular|scapular|banded pull/.test(n))found.add('Tracció horitzontal');
 if(/pectoral|press banca|press de pit|floor press|flexion|push.?up|triceps|triceps/.test(n))found.add('Empenta horitzontal');
 if(/press militar|landmine press|press en landmine|overhead|halo|handstand|elevacio lateral|deltoide|shoulder/.test(n))found.add('Empenta vertical');
 if(/squat|sentad|zancad|lunge|split|step.?up|turmell|dorsiflex|ankle|quadric|qu[aà]driceps|genoll/.test(n))found.add('Dominant de genoll');
 if(/glut|maluc|cadera|bisagra|rdl|deadlift|peso muerto|pes mort|hip thrust|good morning|pull.?through|isquio|femoral|psoas|hamstring/.test(n))found.add('Dominant de maluc');
 if(/thruster|clean|snatch|jerk|swing|slam ball|wall ball|shuttle|farmer carry|suitcase|renegade|circuit|jump|hop|landing|bound/.test(n))found.add('Integració');
 if(b==='Mobilitat'||b==='Activació'||b==='Accessoris'){
  if(/torac|thorac|scapul|escapul|espatll|hombro|rotaci[oó] externa|rotaci[oó] interna|wall slide|pvc|pass through|front rack|face pull|prone lift|pull apart|pajaro|pàjaro|i.?t.?w.?y/.test(n)){
   ['Tracció vertical','Tracció horitzontal','Empenta vertical'].forEach(z=>found.add(z));
  }
  if(/canell|wrist/.test(n)){['Empenta horitzontal','Empenta vertical','Tracció vertical'].forEach(z=>found.add(z))}
  if(/squat mobility|adductor|spiderman|elephant|90\/90|hip|couch/.test(n)){
   ['Dominant de genoll','Dominant de maluc'].forEach(z=>found.add(z));
  }
  if(/biceps|biceps|curl de b[ií]ceps/.test(n)){
   ['Tracció horitzontal','Tracció vertical'].forEach(z=>found.add(z));
  }
 }
 if(/\bpush press\b/.test(n))found.add('Empenta vertical');
 return [...found].filter(z=>PATTERNS.includes(z));
}
function enrichExercise(x){
 if(!Array.isArray(x.uses))x.uses=inferredUses(x);
 if(!Array.isArray(x.relatedPatterns))x.relatedPatterns=inferredRelatedPatterns(x);

/* Les fotografies es guarden a IndexedDB (fora del límit reduït de localStorage).
   Les sessions guarden un ID estable; els JSON exportats inclouen les fotos incrustades. */
const PHOTO_PREFIX='riu-photo:';
const PHOTO_DB='RIU_EXERCICIS_FOTOS_V1';
const PHOTO_STORE='photos';
const photoCache=new Map();
let photoDbPromise=null;
function openPhotoDB(){
 if(photoDbPromise)return photoDbPromise;
 photoDbPromise=new Promise(resolve=>{
  if(!('indexedDB' in window)){resolve(null);return}
  let request;
  try{request=indexedDB.open(PHOTO_DB,1)}catch(err){resolve(null);return}
  request.onupgradeneeded=()=>{const db=request.result;if(!db.objectStoreNames.contains(PHOTO_STORE))db.createObjectStore(PHOTO_STORE)};
  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>resolve(null);
  request.onblocked=()=>resolve(null);
 });
 return photoDbPromise;
}
async function photoPut(id,dataUrl){
 const db=await openPhotoDB();if(!db)return false;
 return new Promise(resolve=>{try{const t=db.transaction(PHOTO_STORE,'readwrite');t.objectStore(PHOTO_STORE).put(dataUrl,id);t.oncomplete=()=>resolve(true);t.onerror=()=>resolve(false);t.onabort=()=>resolve(false)}catch(err){resolve(false)}});
}
async function photoDelete(id){
 photoCache.delete(id);
 const db=await openPhotoDB();if(!db)return;
 await new Promise(resolve=>{try{const t=db.transaction(PHOTO_STORE,'readwrite');t.objectStore(PHOTO_STORE).delete(id);t.oncomplete=resolve;t.onerror=resolve;t.onabort=resolve}catch(err){resolve()}});
}
async function photoLoad(){
 const db=await openPhotoDB();if(!db)return;
 const items=await new Promise(resolve=>{try{const t=db.transaction(PHOTO_STORE,'readonly');const r=t.objectStore(PHOTO_STORE).getAllKeys();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>resolve([])}catch(err){resolve([])}});
 for(const id of items){
  const url=await new Promise(resolve=>{try{const t=db.transaction(PHOTO_STORE,'readonly');const r=t.objectStore(PHOTO_STORE).get(id);r.onsuccess=()=>resolve(r.result||'');r.onerror=()=>resolve('')}catch(err){resolve('')}});
  if(url)photoCache.set(id,url);
 }
}

/* Eliminació de biblioteca: IDs persistents i referències a sessions.
   Per defecte es conserva el text històric de la sessió, mai s'elimina contingut sense marcar-ho. */
function libraryItem(kind,id){return (kind==='motor'?data.motor:data.exercises).find(x=>x.id===id)||null}
function referencesToLibraryItem(item){
 const refs=[];
 for(let mi=0;mi<data.months.length;mi++){
  const m=data.months[mi];
  for(let di=0;di<m.days.length;di++){
   const d=m.days[di];
   const ids=d.itemIds||{};
   const test=(field,idx,value,explicitId,label)=>{
    if(!value&&!explicitId)return;
    if(explicitId?explicitId===item.id:value===item.name)
     refs.push({mi,di,d,field,idx,label,month:m.title,day:DAYS[di]||('Dia '+(di+1))});
   };
   test('main',null,d.main,ids.main,'Principal');
   for(const field of ['mobility','strength','cardio']){
    (d[field]||[]).forEach((value,i)=>test(field,i,value,ids[field+':'+i],({mobility:'Mobilitat',strength:'Força complementària',cardio:'Cardio'}[field])+' '+(i+1)));
   }
   if(Array.isArray(d.activationItems)){
    d.activationItems.forEach((slot,i)=>test('activationItems',i,slot?.value,ids['activationItems:'+i]||slot?.id,(slot?.kind==='hmb'?'HMB':'Activació')+' '+(i+1)));
   }else{
    (d.activation||[]).forEach((value,i)=>test('activation',i,value,ids['activation:'+i],'Activació '+(i+1)));
   }
   // Suport a còpies antigues: una tasca HMB sense activationItems també pot estar assignada.
   if(d.hmb&&!Array.isArray(d.activationItems))test('hmb',null,d.hmb,ids.hmb,'HMB');
  }
 }
 return refs;
}
function openDeleteConfirmation(kind,id){

 const info=refs.slice(0,7).map(r=>`<li>${e(r.month)} · ${e(r.day)} · ${e(r.label)}</li>`).join('');
 $('#modal').innerHTML=`<div class="overlay" data-action="outside"><div class="modal"><div class="modalhead"><h3>Eliminar ${e(noun)}?</h3><button class="close" data-action="close" aria-label="Tancar">×</button></div><div class="modalbody">

 <div><strong>Actualment apareix en ${refs.length} ${refs.length===1?'lloc':'llocs'} ${refs.length===1?'d’una sessió':'de sessions'}.</strong></div>
 ${refs.length?`<ul class="delete-ref-list">${info}${refs.length>7?`<li>... i ${refs.length-7} llocs més</li>`:''}</ul>`:'<p class="delete-help">No està assignat a cap sessió actual.</p>'}
 ${refs.length?`<label class="delete-options"><input type="checkbox" id="deleteAlsoFromSessions"><span><strong>Treure'l també de totes aquestes sessions</strong><span class="delete-help" style="display:block">Si ho marques, els camps on s'utilitza quedaran buits. Si no ho marques, conservaran el nom com a text, però ja no tindran fitxa ni fotografia vinculada.</span></span></label>`:''}
 <div class="delete-help">Aquesta acció no es pot desfer des del programa. Si vols poder recuperar l'exercici i la foto, exporta abans una còpia JSON.</div>
 <div class="actions" style="margin-top:20px"><button class="btn" data-action="cancel-delete-item" data-kind="${e(kind)}" data-id="${e(item.id)}">Cancel·lar</button><button class="btn" data-action="backup">Exportar còpia JSON</button><span class="grow"></span><button class="btn danger solid" data-action="confirm-delete-item" data-kind="${e(kind)}" data-id="${e(item.id)}">Sí, eliminar ${e(noun)}</button></div>
 </div></div></div>`;
}
async function deleteLibraryItem(kind,id,deleteFromSessions){
 const item=libraryItem(kind,id);if(!item)return;
 const before=clone(data);
 const refs=referencesToLibraryItem(item);
 for(const ref of refs){
  const {d,field,idx}=ref;
  if(!d.itemIds)d.itemIds={};
  const key=selectedKey(field,idx);
  delete d.itemIds[key];
  if(field==='activationItems'&&d.activationItems?.[idx])d.activationItems[idx].id='';
  if(deleteFromSessions){
   if(idx===null||idx===undefined)d[field]='';
   else if(field==='activationItems')d.activationItems[idx].value='';

  pptx.defineLayout({name:'RIU_TV',width:slideW,height:slideH});pptx.layout='RIU_TV';pptx.author='RIU Centre d’Entrenament';pptx.subject='Sessió per a televisió · RIU';pptx.title=DAYS[dayIx]+' · '+model.m.title;
  pptx.lang='ca-ES';
  const slide=pptx.addSlide();slide.background={color:'171717'};
  slide.addImage({data:bg,x:0,y:0,w:slideW,h:slideH});
  const W=model.portrait?1080:1920,H=model.portrait?1920:1080;
  for(const sh of photoScene.shapes){if(sh.type==='circle'){slide.addShape(pptx.ShapeType.ellipse,{x:sh.x/W*slideW,y:sh.y/H*slideH,w:sh.size/W*slideW,h:sh.size/H*slideH,fill:{color:sh.fill},line:{color:sh.fill,transparency:100}})}}
  // Les fotografies queden com a objectes independents del PPTX.
  const pics=[];for(const ph of photoScene.photos){
   try{if(!ph.src)continue;const image=await new Promise((resolve,reject)=>{const im=new Image();if(/^https?:/i.test(ph.src))im.crossOrigin='anonymous';im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('foto'));im.src=ph.src});const mini=document.createElement('canvas');mini.width=110;mini.height=110;mini.getContext('2d').drawImage(image,0,0,110,110);pics.push({...ph,data:mini.toDataURL('image/png')})}catch(err){}
  }
  for(const ph of pics){slide.addImage({data:ph.data,x:ph.x/W*slideW,y:ph.y/H*slideH,w:ph.w/W*slideW,h:ph.h/H*slideH});}
  for(const t of photoScene.commands){
   const inchPerPx=slideW/W;
   const height=Math.max(.12,t.size*1.42/H*slideH),top=Math.max(0,(t.y-t.size*.13)/H*slideH);
   let tx=t.x/W*slideW,tw=slideW-tx-.05,align=t.align||'left';
   if(align==='right'){const pxWidth=Math.min(W*.5,Math.max(t.size*2.0,t.text.length*t.size*.65));tw=pxWidth/W*slideW;tx=Math.max(0,tx-tw)}
   else if(align==='center'){const pxWidth=Math.min(W*.92,Math.max(t.size*1.7,t.text.length*t.size*.66));tw=pxWidth/W*slideW;tx=Math.max(0,(t.x-pxWidth/2)/W*slideW)}
   slide.addText(t.text,{x:tx,y:top,w:tw,h:height,fontFace:'Arial',fontSize:t.size*72*inchPerPx/1.0,bold:t.bold||false,color:t.color.replace('#',''),align,margin:0,breakLine:false,fit:'shrink',valign:'mid'});
  }
  await pptx.writeFile({fileName:tvSafeName()+'.pptx'});
  toast('PowerPoint descarregat: també el pots importar a Canva.');
 }catch(ex){console.error('Error exportant PowerPoint',ex);toast('No s’ha pogut exportar PowerPoint. Revisa la consola o prova el PNG.')}
}

/* RIU GitHub Pages: dades públiques a dades/riu.json. Cap secret incrustat.
   Autorització: token fine-grained demanat per cada publicació i mantingut només en memòria
   durant la petició. Sense backend, un token de navegador no és equivalent a OAuth servidor. */
const RIU_GH_PATH='dades/riu.json';
const RIU_GH_CONFIG='RIU_GITHUB_CONFIG_V1';
let githubConfig={owner:'riuesport',repo:'sessions-entrenament',branch:'main'};
try{const cfg=JSON.parse(localStorage.getItem(RIU_GH_CONFIG)||'{}');githubConfig={...githubConfig,...cfg}}catch(_e){}
if(!githubConfig.owner&&/\.github\.io$/i.test(location.hostname)){githubConfig.owner=location.hostname.split('.')[0];githubConfig.repo=location.pathname.split('/').filter(Boolean)[0]||githubConfig.owner+'.github.io'}
const RIU_GH_DIRTY='RIU_GITHUB_PENDING_V1';
const RIU_GH_BASE='RIU_GITHUB_LAST_SHA_V1';
let githubRemoteSha=localStorage.getItem(RIU_GH_BASE)||null,githubLoaded=false,githubDirty=localStorage.getItem(RIU_GH_DIRTY)==='1',githubBusy=false;
function githubStatus(message){const el=document.getElementById('githubBanner');if(el)el.textContent=message;}
function githubValidateConfig(){
 const {owner,repo,branch}=githubConfig;
 if(!/^[A-Za-z0-9-]{1,39}$/.test(owner)||!/^[A-Za-z0-9_.-]{1,100}$/.test(repo)||!/^[A-Za-z0-9_./-]{1,200}$/.test(branch)||branch.includes('..')||branch.startsWith('/')||branch.endsWith('/'))throw Error('Configura correctament usuari, repositori i branca.');
}
function githubConfigure(){
 const owner=prompt('GitHub · Nom de l’usuari o organització propietària del repositori:',githubConfig.owner);if(owner===null)return;
 const repo=prompt('GitHub · Nom del repositori (ex.: riu-entrenaments):',githubConfig.repo);if(repo===null)return;
 const branch=prompt('GitHub · Branca de publicació:',githubConfig.branch||'main');if(branch===null)return;
 const old=JSON.stringify(githubConfig);githubConfig={owner:owner.trim(),repo:repo.trim(),branch:branch.trim()};
 try{githubValidateConfig()}catch(err){alert(err.message);return}
 localStorage.setItem(RIU_GH_CONFIG,JSON.stringify(githubConfig));
 if(old!==JSON.stringify(githubConfig)){githubRemoteSha=null;githubLoaded=false;localStorage.removeItem(RIU_GH_BASE);}
 githubStatus('GitHub configurat: '+githubConfig.owner+'/'+githubConfig.repo+' · '+githubConfig.branch+'. Carrega el JSON publicat abans de modificar-lo.');
}
function githubApiUrl(){githubValidateConfig();return 'https://api.github.com/repos/'+encodeURIComponent(githubConfig.owner)+'/'+encodeURIComponent(githubConfig.repo)+'/contents/'+RIU_GH_PATH+'?ref='+encodeURIComponent(githubConfig.branch)}
function githubFileUrl(){githubValidateConfig();return 'https://raw.githubusercontent.com/'+encodeURIComponent(githubConfig.owner)+'/'+encodeURIComponent(githubConfig.repo)+'/'+encodeURIComponent(githubConfig.branch)+'/'+RIU_GH_PATH+'?v='+Date.now()}
function githubBase64(text){const bytes=new TextEncoder().encode(text);let binary='';for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(binary)}
async function githubSnapshot(){
 const copy=clone(data);let missing=0;
 for(const item of [...copy.exercises,...copy.motor]){
  if(typeof item.media==='string'&&item.media.startsWith(PHOTO_PREFIX)){
   item.media=photoCache.get(item.id)||'';if(!item.media)missing++;
  }
 }
 if(missing)throw Error('Hi ha '+missing+' fotografies locals que no es poden incloure. Exporta una còpia i revisa-les abans de publicar.');
 return copy;
}
async function githubLoad(manual){
 if(githubBusy)return;
 if(!manual&&githubDirty){githubStatus('● Tens canvis locals pendents de publicar. No es carregaran dades remotes sense el teu permís.');return}
 // Per a una web de GitHub Pages, el JSON es llegeix del mateix lloc que la web.
 // En obrir l'HTML com a fitxer local, la configuració permet llegir-lo de raw.githubusercontent.
 const onPages=/\.github\.io$/i.test(location.hostname);
 let url;
 try{url=onPages?new URL('./'+RIU_GH_PATH+'?v='+Date.now(),location.href).href:githubFileUrl()}
 catch(err){if(manual)alert('Primer configura el repositori amb el botó ⚙ GitHub.');else githubStatus('Mode local: configura GitHub per carregar les dades compartides.');return}
 if(manual&&githubDirty&&!confirm('Tens canvis locals sense publicar. Carregar GitHub els substituirà. Continuar?'))return;
 githubBusy=true;githubStatus('GitHub: carregant dades publicades…');
 try{
  const response=await fetch(url,{cache:'no-store'});
  if(!response.ok)throw Error('No s’ha pogut llegir dades/riu.json (HTTP '+response.status+').');
  const remote=await response.json();
  if(!Array.isArray(remote.months)||!Array.isArray(remote.exercises)||!Array.isArray(remote.motor))throw Error('El JSON publicat no és una còpia RIU vàlida.');
  // Protegir la feina local existent: només càrrega automàtica quan no hi ha modificacions locals pendents.
  if(!manual&&githubDirty){githubStatus('Hi ha canvis locals pendents. No s’ha substituït el treball actual.');return}
  data=remote;enrichLibrary();mergeDefaultCatalog();seedMissingMesocycles();
  await migrateOldPhotos();
  for(const item of [...data.exercises,...data.motor]){
   if(typeof item.media==='string'&&item.media.startsWith('data:image/')){
    photoCache.set(item.id,item.media);
    if(await photoPut(item.id,item.media))item.media=PHOTO_PREFIX+item.id;
   }
  }
  try{const info=await fetch(githubApiUrl(),{headers:{'Accept':'application/vnd.github+json'},cache:'no-store'});if(info.ok){const metadata=await info.json();githubRemoteSha=metadata.sha||null; if(githubRemoteSha)localStorage.setItem(RIU_GH_BASE,githubRemoteSha)}}catch(_e){}
  githubDirty=false;githubLoaded=true;localStorage.removeItem(RIU_GH_DIRTY);save();render();
  githubStatus('✓ Dades carregades de GitHub · '+new Date().toLocaleString('ca-ES')+' · Els canvis es publiquen amb ☁ Publicar a GitHub.');
 }catch(err){githubStatus('GitHub: '+err.message+' · Les dades locals no s’han esborrat.');if(manual)alert(err.message)}
 finally{githubBusy=false}
}
async function githubPublish(){
 if(githubBusy)return;
 try{githubValidateConfig()}catch(err){alert('Primer configura GitHub amb ⚙ GitHub.');return}
 if(!confirm('Vols publicar l’estat actual de RIU a '+githubConfig.owner+'/'+githubConfig.repo+' ('+githubConfig.branch+')? Aquest JSON serà accessible públicament si el repositori/Pages és públic. No hi incloguis dades personals de clients.'))return;
 const token=prompt('Enganxa un token personal de GitHub de permisos limitats (Contents: Read and write) només per a aquest repositori. No es guardarà al navegador:');
 if(token===null||!token.trim())return;
 githubBusy=true;githubStatus('GitHub: comprovant la versió i preparant la publicació…');
 try{
  const api=githubApiUrl();
  const headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+token.trim(),'X-GitHub-Api-Version':'2022-11-28'};
  const current=await fetch(api,{headers,cache:'no-store'});
  let sha=null;
  if(current.ok){const meta=await current.json();sha=meta.sha}
  else if(current.status!==404)throw Error('GitHub ha rebutjat la lectura (HTTP '+current.status+'). Comprova token i permisos.');
  if(githubRemoteSha&&sha!==githubRemoteSha)throw Error('Algú ha publicat una altra versió. Carrega les dades noves abans de publicar per evitar perdre canvis.');
  // Quan no s'ha carregat mai la versió remota, exigir confirmació addicional.
  if(!githubLoaded&&sha&&!confirm('Encara no has carregat les dades compartides d’aquest repositori en aquesta sessió. Vols substituir la versió existent?'))return;
  const snapshot=await githubSnapshot();
  const body={message:'RIU: actualització de la programació '+new Date().toISOString(),content:githubBase64(JSON.stringify(snapshot,null,2)),branch:githubConfig.branch};
  if(sha)body.sha=sha;
  const result=await fetch('https://api.github.com/repos/'+encodeURIComponent(githubConfig.owner)+'/'+encodeURIComponent(githubConfig.repo)+'/contents/'+RIU_GH_PATH,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!result.ok){let reason='';try{const detail=await result.json();reason=detail.message||''}catch(_e){}throw Error('No s’ha pogut publicar (HTTP '+result.status+'). '+reason)}
  const uploaded=await result.json();githubRemoteSha=uploaded.content?.sha||null;githubLoaded=true;githubDirty=false;localStorage.removeItem(RIU_GH_DIRTY);if(githubRemoteSha)localStorage.setItem(RIU_GH_BASE,githubRemoteSha);
  githubStatus('✓ Publicat a GitHub · '+new Date().toLocaleString('ca-ES')+' · GitHub Pages pot trigar una mica a mostrar els canvis.');
  alert('Publicat correctament! En Bernat pot actualitzar la pàgina o prémer ↻ Carregar publicat.');
 }catch(err){githubStatus('GitHub: '+err.message);alert(err.message)}finally{githubBusy=false}
}
